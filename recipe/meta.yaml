{% set name = "xgrammar" %}
{% set version = "0.2.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: f76423630ae3ac4e090cb38ce1e30e7bcc69b3dee4d22d94353944386a4c6f18

build:
  number: 0
  missing_dso_whitelist:
    # libtvm_ffi.so will get loaded by xgrammar code (and apache-tvm-ffi code) before
    # libxgrammar_bindings.so will attempt to load it, so it will already be loaded into
    # the applications memory space before it is needed. There is no mechanism that guarentees
    # this behavior, however this is the stated intent of the tvm_ffi project. While a
    # change that breaks this behavior is unlikely, it would cause a problem. Trying to
    # balance the stated intent of the library vs the lack of machinery to enforce it,
    # it is probably sufficient to use pin_compatible on the apache-tvm-ffi library.
    # See: https://github.com/mlc-ai/xgrammar/blob/v0.2.2/python/xgrammar/__init__.py#L1
    # and https://github.com/mlc-ai/xgrammar/blob/v0.2.2/python/xgrammar/load_binding.py
    # and https://github.com/apache/tvm-ffi/blob/v0.1.9/python/tvm_ffi/__init__.py#L33-L36
    - $RPATH/libtvm_ffi.so  # [linux]
    - $RPATH/tvm_ffi.dll  # [win]
    - $RPATH/libtvm_ffi.dylib  # [osx]
  skip: true  # [py<38]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - ninja-base
    # binutils needed for "strip" command
    - binutils  #[linux]
  host:
    - python
    - scikit-build-core >=0.10.0
    - apache-tvm-ffi >=0.1.9
    - pip
    - pytorch {{ pytorch }}
  run:
    - python
    # Pinning apache-tvm-ffi exactly guarantees that libtvm_ffi.so will be loaded prior to
    # xgrammar libraries, but is probably a bit too strict. Relax the run constraint a bit
    # with pin_compatible. See comment in missing_dso_whitelist.
    - {{ pin_compatible("apache-tvm-ffi", max_pin="x.x") }}
    - pydantic
    - pytorch >=1.10.0
    - transformers >=4.38.0
    - triton  # [linux and x86_64]
    - numpy
    - typing-extensions >=4.9.0
    - apache-tvm-ffi >=0.1.9
    - typing_extensions >=4.9.0

test:
  source_files:
    - tests/
  imports:
    - xgrammar
  commands:
    - pip check
    - pytest -m "not hf_token_required"
  requires:
    - pip
    - protobuf
    - pytest
    - huggingface_hub
    - sentencepiece
    - tiktoken

about:
  home: https://github.com/mlc-ai/xgrammar
  summary: XGrammar is an open-source library for efficient, flexible, and portable structured generation.
  description: |
    XGrammar is an open-source library for efficient, flexible, and portable
    structured generation. It leverages constrained decoding to ensure 100%
    structural correctness of the output. It supports general context-free
    grammar to enable a broad range of structures, including JSON, regex,
    custom context-free grammar, etc.
  # xgrammar uses the Apache license, but it vendors picojson, which appears to use a
  # combination of the Apache 2 and BSD-2-Clause licenses.
  license: Apache-2.0 AND BSD-2-Clause
  license_file:
    - LICENSE
    - NOTICE
  license_family: Apache
  dev_url: https://github.com/mlc-ai/xgrammar
  doc_url: https://github.com/mlc-ai/xgrammar

extra:
  recipe-maintainers:
    - zbowling
    - Ubospica
